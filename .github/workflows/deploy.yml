name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build static export
        env:
          NEXT_BASE_PATH: /ml-relay-site
          # GitHub sign-in service (auth/README.md). Public URL; empty = token sign-in only.
          NEXT_PUBLIC_GH_AUTH_PROXY: ${{ vars.GH_AUTH_PROXY }}
          # The GitHub App's public client id: lets "Sign in" redirect without a round trip.
          NEXT_PUBLIC_GH_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
        run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
